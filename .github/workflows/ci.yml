name: CI

# Validation ONLY. This workflow has no deploy step, no environment and no
# secrets, and must never gain any: production deployment lives exclusively
# in deploy-production-worker.yml (manual, confirmed, main-only). That
# separation is enforced by scripts/ci/workflowSafety.test.ts, which runs
# below as part of the ordinary test suite.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
